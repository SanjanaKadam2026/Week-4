
<!DOCTYPE html>
<html>
<body>
  <h2>Async Function</h2>
  <button onclick="showMessage()">Click Me</button>
  <p id="result"></p>

  <script>
    async function showMessage() {
      return "Hello! I am learning JavaScript.";
    }

    showMessage().then((message) => {
      document.getElementById("result").textContent = message;
    });
  </script>
</body>
</html>
