
<!DOCTYPE html>
<html>
<body>
  <h2>Fetch API</h2>
  <button onclick="getUser()">Get User</button>
  <p id="result"></p>

  <script>
    function getUser() {
      fetch("https://jsonplaceholder.typicode.com/users/1")
        .then((response) => {
          if (!response.ok) {
            throw new Error("Request failed");
          }

          return response.json();
        })
        .then((user) => {
          document.getElementById("result").textContent =
            "Name: " + user.name +
            " | Email: " + user.email;
        })
        .catch((error) => {
          document.getElementById("result").textContent =
            "Error: " + error.message;
        });
    }
  </script>
</body>
</html>
