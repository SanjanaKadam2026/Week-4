<!DOCTYPE html>
<html>
<body>
  <h2>Callback Function</h2>
  <button onclick="showMessage()">Click Me</button>
  <p id="result"></p>

  <script>
    function greet(callback) {
      callback();
    }

    function showMessage() {
      document.getElementById("result").textContent =
        "Hello! Welcome to JavaScript.";
    }

    greet(showMessage);
  </script>
</body>
</html>
