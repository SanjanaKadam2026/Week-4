<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Classes</title>
</head>
<body>
    <h2>Student Details</h2>
    <script>
        class Student {
            constructor(name, course) {
                this.name = name;
                this.course = course;
            }

            introduce() {
                console.log(`My name is ${this.name}`);
                console.log(`I am learning ${this.course}`);
            }
        }

        const s1 = new Student("Sanjana", "JavaScript");
        const s2 = new Student("Rahul", "Python");

        s1.introduce();
        s2.introduce();
    </script>
</body>
</html>
