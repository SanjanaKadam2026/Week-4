<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Inheritance</title>
</head>
<body>
    <h2>JavaScript Inheritance</h2>

    <script>
        // Parent class
        class Animal {
            eat() {
                console.log("Animal is eating");
            }
        }

        // Child class
        class Dog extends Animal {
            bark() {
                console.log("Dog is barking");
            }
        }

        // Create object
        const dog1 = new Dog();

        dog1.eat();
        dog1.bark();
    </script>
</body>
</html>
