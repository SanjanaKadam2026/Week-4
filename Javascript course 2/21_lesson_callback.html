<!DOCTYPE html>
<html>
<body>
    <h2>Callback Example</h2>

    <script>
        function greet(name, callback) {
            console.log("Hello " + name);
            callback();
        }

        function message() {
            console.log("Welcome to JavaScript!");
        }

        greet("Sanjana", message);
    </script>
</body>
</html>
