<!DOCTYPE html>
<html lang="en">
<head>
    <title>Query Selector</title>
</head>
<body>

    <h1 id="heading">Hello World!</h1>

    <script>
        const result = document.querySelector("#heading");

        console.log(result);
        console.log(result.textContent);
    </script>

</body>
</html>
