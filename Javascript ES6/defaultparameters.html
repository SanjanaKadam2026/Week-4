
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Default Parameters</title>
</head>
<body>
    <h1>JavaScript Default Parameters</h1>

    <button onclick="greetUser()">Greet Guest</button>
    <button onclick="greetUser('Sanjana')">Greet Sanjana</button>

    <p id="result">Click a button!</p>

    <script>
        function greetUser(name = "Guest") {
            document.getElementById("result").textContent =
                "Hello, " + name + "!";
        }
    </script>
</body>
</html>
