
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spread Operator</title>
</head>
<body>
    <h1>JavaScript Spread Operator</h1>

    <button onclick="combineFruits()">Combine Fruits</button>

    <p id="result">Click the button to see the result.</p>

    <script>
        function combineFruits() {
            const fruits1 = ["Apple", "Mango"];
            const fruits2 = ["Banana", "Orange"];

            const allFruits = [...fruits1, ...fruits2];

            document.getElementById("result").textContent =
                allFruits.join(", ");
        }
    </script>
</body>
</html>
